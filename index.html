<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Контроль финансов</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #1c1c1e);
      --card-bg: var(--tg-theme-secondary-bg-color, #2c2c2e);
      --text-color: var(--tg-theme-text-color, #ffffff);
      --button-color: var(--tg-theme-button-color, #0a84ff);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
    }
    .segmented-control {
      display: flex;
      background: rgba(118, 118, 128, 0.24);
      border-radius: 9px;
      padding: 2px;
      width: 100%;
      max-width: 340px;
      margin-bottom: 16px;
    }
    .segmented-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 600;
      border-radius: 7px;
      cursor: pointer;
      color: var(--text-color);
      transition: all 0.2s ease;
    }
    .segmented-btn.active {
      background: var(--card-bg);
      box-shadow: 0px 3px 8px rgba(0, 0, 0, 0.3);
    }
    
    /* Дисплей суммы в стиле iOS */
    .amount-display-card {
      width: 100%;
      max-width: 340px;
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 16px;
    }
    .amount-val {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .currency-symbol {
      font-size: 28px;
      font-weight: 600;
      color: #8e8e93;
    }

    .manual-input {
      width: 100%;
      padding: 12px;
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      box-sizing: border-box;
      outline: none;
      background: var(--card-bg);
      color: var(--text-color);
    }

    .label-group {
      width: 100%;
      max-width: 340px;
      font-size: 12px;
      color: #8e8e93;
      text-transform: uppercase;
      margin: 8px 0 6px 4px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 340px;
      margin-bottom: 12px;
    }
    .option-card {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      border: 2px solid transparent;
      cursor: pointer;
    }
    .option-card.selected {
      border-color: var(--button-color);
      background: rgba(10, 132, 255, 0.15);
    }
    .save-btn {
      width: 100%;
      max-width: 340px;
      padding: 14px;
      background: var(--button-color);
      color: var(--button-text);
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="segmented-control">
    <button class="segmented-btn active" id="btnExpense" onclick="setType('Расход')">Расход</button>
    <button class="segmented-btn" id="btnIncome" onclick="setType('Доход')">Доход</button>
  </div>

  <!-- Ввод суммы -->
  <div style="width: 100%; max-width: 340px; margin-bottom: 16px;">
    <input type="number" step="any" inputmode="decimal" class="manual-input" id="manualInput" placeholder="0 €" oninput="updateDisplay()">
  </div>

  <div class="label-group">Категория</div>
  <div class="grid" id="categoryGrid"></div>

  <div class="label-group">Счет</div>
  <div class="grid" id="accountGrid"></div>

  <button class="save-btn" onclick="sendData()">Сохранить</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let currentType = "Расход";
    let selectedCategory = "";
    let selectedAccount = "Карта";

    const categoriesExpense = ["🍔 Кафешки", "🛒 Продукты", "🚗 Авто + заправка", "🏠 Стики", "🎉 Развлечения", "📦 Другое", "💵 Подписки"];
    const categoriesIncome = ["💼 Зарплата", "🎁 Подарок", "💰 Другое"];
    const accounts = ["Карта", "💵 Наличные"];

    function renderOptions() {
      const catGrid = document.getElementById('categoryGrid');
      catGrid.innerHTML = '';
      const list = currentType === "Расход" ? categoriesExpense : categoriesIncome;
      selectedCategory = list[0];

      list.forEach(cat => {
        const div = document.createElement('div');
        div.className = `option-card ${cat === selectedCategory ? 'selected' : ''}`;
        div.innerText = cat;
        div.onclick = () => {
          document.querySelectorAll('#categoryGrid .option-card').forEach(c => c.classList.remove('selected'));
          div.classList.add('selected');
          selectedCategory = cat;
        };
        catGrid.appendChild(div);
      });

      const accGrid = document.getElementById('accountGrid');
      accGrid.innerHTML = '';
      accounts.forEach(acc => {
        const div = document.createElement('div');
        div.className = `option-card ${acc === selectedAccount ? 'selected' : ''}`;
        div.innerText = acc;
        div.onclick = () => {
          document.querySelectorAll('#accountGrid .option-card').forEach(c => c.classList.remove('selected'));
          div.classList.add('selected');
          selectedAccount = acc;
        };
        accGrid.appendChild(div);
      });
    }

    function setType(type) {
      currentType = type;
      document.getElementById('btnExpense').classList.toggle('active', type === 'Расход');
      document.getElementById('btnIncome').classList.toggle('active', type === 'Доход');
      renderOptions();
    }

    function sendData() {
      const rawVal = document.getElementById('manualInput').value.trim().replace(',', '.');
      const amount = parseFloat(rawVal);

      if (isNaN(amount) || amount <= 0) {
        tg.showAlert("Пожалуйста, укажите сумму больше 0");
        return;
      }

      tg.sendData(JSON.stringify({
        type: currentType,
        amount: amount,
        category: selectedCategory,
        account: selectedAccount
      }));
    }

    renderOptions();
  </script>
</body>
</html>
